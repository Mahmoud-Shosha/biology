name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Keep the test report when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # Pages deployed by Actions are never built with Jekyll, so no .nojekyll is needed.
      - name: Collect the site files
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp -r index.html css js _site/
          if [ -d images ]; then cp -r images _site/; fi
          # Link previews need absolute addresses.
          sed -i \
            -e "s#property=\"og:image\" content=\"#&${BASE_URL}/#" \
            -e "s#property=\"og:url\" content=\"./\"#property=\"og:url\" content=\"${BASE_URL}/\"#" \
            _site/index.html
          grep 'og:' _site/index.html

      # upload-pages-artifact v5 and deploy-pages v5 go together (same artifact format).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
